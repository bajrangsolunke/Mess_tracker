# Render's free plan puts the API to sleep after ~15 idle minutes; the next visitor then
# waits 30-60 s. Pinging /health every 10 minutes during mess hours keeps it awake.
# (05:30-00:30 IST; ~590 of the 750 free hours a month.) GitHub may delay scheduled runs a
# little, and pauses them if the repo has no activity for 60 days: then just push anything
# or run this workflow by hand. Upgrading Render to a paid plan removes the need for this.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 0-18 * * *" # every 10 min, 00:00-18:59 UTC = 05:30-00:29 IST
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping health check
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://mess-tracker-api.onrender.com/health
